# ============================================================================
# Análisis de calidad con SonarQube Cloud.
#
# El proyecto es un monorepo con dos cadenas de herramientas: la aplicación
# móvil en la raíz y la API en server/. Sonar analiza las dos en un solo
# proyecto porque se entregan y se califican juntas.
#
# Cómo ejecutarlo:
#   1. Crear el proyecto en sonarcloud.io enlazando el repositorio de GitHub.
#   2. Copiar la organización y la clave que asigne, y ponerlas abajo.
#   3. Generar un token y guardarlo como secreto SONAR_TOKEN en GitHub.
#   4. El flujo de CI genera la cobertura y lanza el análisis.
#
# Se usa análisis desde CI y no el automático de SonarCloud porque el
# automático NO importa la cobertura de pruebas, que es justo lo que hay
# que demostrar.
# ============================================================================

# --- Identidad del proyecto -------------------------------------------------
# Ajustar a lo que asigne SonarCloud: suele ser <organizacion>_<repositorio>.
sonar.projectKey=Mateotc1198_PantallasDM
sonar.organization=mateotc1198
sonar.projectName=ZonaBarber
sonar.projectVersion=1.0.0

# --- Qué se analiza ---------------------------------------------------------
# app/ y src/ son la aplicación móvil; server/src es la API.
sonar.sources=app,src,server/src,server/scripts
sonar.tests=server/tests,__tests__

sonar.sourceEncoding=UTF-8

# --- Qué se deja fuera ------------------------------------------------------
# dist y coverage son salidas de herramientas, no código escrito a mano.
# Medirlos no dice nada del proyecto y además hunde las métricas.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.expo/**,\
  **/*.config.js,\
  server/db/**

# Los archivos de pruebas se analizan como pruebas, no como código de
# producción: Sonar no debe exigir cobertura de la cobertura.
sonar.test.inclusions=server/tests/**/*.ts,__tests__/**/*

# --- Cobertura --------------------------------------------------------------
# Rutas relativas a la raíz. La del backend la genera `npm run test:coverage`
# dentro de server/; la de la app, su propio runner.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,coverage/lcov.info

# El esquema SQL y las semillas no son código analizable por Sonar y
# aparecerían como ruido.
sonar.coverage.exclusions=\
  **/*.config.*,\
  server/scripts/**,\
  app/**/_layout.tsx
